name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Backend tests
        run: npm test --prefix backend
      - name: SDK tests
        run: npm test --prefix packages/sdk-node
      - name: Secret scan
        run: npm run scan:secrets
      - name: Astryx theme check
        run: npm run check:theme
      - name: Astryx integration check
        run: npm run check:astryx
      - name: Type check and build frontend
        run: npm run build --prefix frontend
      - name: Motion formatting tests
        run: npm run test:motion --prefix frontend

  redis:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Shared rate limits against a real Redis server
        run: SF_REDIS_URL=redis://127.0.0.1:6379 node --test tests/ratelimit-redis.test.mjs
        working-directory: backend

  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Build the web client
        run: npm run build --prefix frontend
      - name: Accessibility checks in dark and light themes
        run: npm run test:a11y --prefix frontend
      - name: Upload axe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axe-results
          path: frontend/test-results
          if-no-files-found: ignore
