services:
  secureflow:
    build: .
    ports:
      - "4000:4000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      SF_DATA_DIR: /data
      # Shared counters so two API instances cannot be bypassed by switching.
      # Leave SF_REDIS_URL empty to run the single process memory store.
      SF_REDIS_URL: ${SF_REDIS_URL:-redis://redis:6379}
      SF_RATE_LIMIT_FAIL_MODE: ${SF_RATE_LIMIT_FAIL_MODE:-local}
      # Demo mode is off in production. Set SF_DEMO_MODE=true only for a
      # throwaway demo deployment with synthetic data.
      SF_DEMO_MODE: ${SF_DEMO_MODE:-}
      # Required on an empty database when demo mode is off.
      SF_BOOTSTRAP_EMAIL: ${SF_BOOTSTRAP_EMAIL:-}
      SF_BOOTSTRAP_PASSWORD: ${SF_BOOTSTRAP_PASSWORD:-}
      SF_BOOTSTRAP_ORG: ${SF_BOOTSTRAP_ORG:-SecureFlow Workspace}
      SF_BOOTSTRAP_NAME: ${SF_BOOTSTRAP_NAME:-Workspace owner}
      # Optional providers. Leave empty to keep lookups local.
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      # Optional separate MiroFish service (AGPL-3.0), not started by this compose file.
      MIROFISH_BASE_URL: ${MIROFISH_BASE_URL:-}
    volumes:
      - secureflow-data:/data
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  secureflow-data:
